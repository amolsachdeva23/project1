<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f8fafc;
        background:
          radial-gradient(circle at 15% 20%, #7c3aed 0, transparent 28rem),
          radial-gradient(circle at 85% 80%, #0891b2 0, transparent 30rem),
          #07111f;
      }

      .orb {
        position: fixed;
        width: 18rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(2px);
        opacity: 0.4;
        animation: drift 8s ease-in-out infinite alternate;
      }

      .orb-one {
        top: -5rem;
        right: 8%;
        background: #ec4899;
      }

      .orb-two {
        bottom: -7rem;
        left: 5%;
        width: 14rem;
        background: #22d3ee;
        animation-delay: -3s;
      }

      main {
        position: relative;
        width: min(90%, 46rem);
        padding: clamp(2.5rem, 8vw, 5.5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 2rem;
        background: rgba(15, 23, 42, 0.6);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
        animation: appear 700ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.55rem 0.9rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: #c4b5fd;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .badge::before {
        content: "";
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 0.8rem #34d399;
      }

      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: clamp(3rem, 10vw, 6.5rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
        background: linear-gradient(110deg, #fff, #c4b5fd 45%, #67e8f9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 34rem;
        margin: 0 auto;
        color: #cbd5e1;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.9rem 1.35rem;
        border-radius: 0.8rem;
        color: #07111f;
        background: linear-gradient(135deg, #a78bfa, #67e8f9);
        box-shadow: 0 0.7rem 1.7rem rgba(103, 232, 249, 0.2);
        font-weight: 800;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      a:hover {
        transform: translateY(-3px);
        box-shadow: 0 1rem 2rem rgba(103, 232, 249, 0.35);
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(1.5rem) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes drift {
        to { transform: translate(2rem, 1.5rem) scale(1.12); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>

    <main>
      <span class="badge">Ready to build</span>
      <h1>Hello, World!</h1>
      <p>A small beginning with big possibilities. Your next great idea starts right here.</p>
      <a href="https://developer.mozilla.org/en-US/docs/Learn" target="_blank" rel="noreferrer">Start exploring →</a>
    </main>
  </body>
</html>
