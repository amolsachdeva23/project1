<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Hello, World!</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: radial-gradient(circle at 5% 80%, #7c3aed 0, transparent 28rem), radial-gradient(circle at 90% 15%, #0891b2 0, transparent 29rem), #07111f; }
      nav { display: flex; justify-content: space-between; align-items: center; width: min(92%, 70rem); margin: 0 auto; padding: 1.5rem 0; }
      .brand { color: #fff; font-weight: 900; letter-spacing: -.04em; text-decoration: none; }
      .links { display: flex; gap: .35rem; padding: .35rem; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; background: rgba(15,23,42,.55); backdrop-filter: blur(12px); }
      .links a { padding: .55rem .85rem; border-radius: 999px; color: #e2e8f0; font-size: .9rem; font-weight: 700; text-decoration: none; }
      .links a:hover, .links a[aria-current="page"] { color: #07111f; background: #f8fafc; }
      main { display: grid; grid-template-columns: .85fr 1.15fr; gap: clamp(2rem, 7vw, 7rem); align-items: center; width: min(88%, 68rem); min-height: calc(100vh - 6rem); margin: 0 auto; padding: 3rem 0 6rem; }
      .eyebrow { color: #67e8f9; font-size: .85rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: .75rem 0 1.25rem; font-size: clamp(3rem, 7vw, 5.5rem); line-height: .95; letter-spacing: -.065em; }
      p { color: #cbd5e1; font-size: 1.1rem; line-height: 1.75; }
      form { display: grid; gap: 1rem; padding: clamp(1.5rem, 4vw, 2.5rem); border: 1px solid rgba(255,255,255,.16); border-radius: 1.5rem; background: rgba(15,23,42,.58); box-shadow: 0 2rem 5rem rgba(0,0,0,.25); backdrop-filter: blur(18px); }
      label { color: #e2e8f0; font-size: .9rem; font-weight: 700; }
      input, textarea { width: 100%; margin-top: .45rem; padding: .85rem 1rem; border: 1px solid rgba(255,255,255,.17); border-radius: .7rem; outline: none; color: #f8fafc; background: rgba(255,255,255,.08); font: inherit; }
      input:focus, textarea:focus { border-color: #67e8f9; box-shadow: 0 0 0 .2rem rgba(103,232,249,.14); }
      textarea { min-height: 7rem; resize: vertical; }
      button { padding: .9rem 1.35rem; border: 0; border-radius: .8rem; cursor: pointer; color: #07111f; background: linear-gradient(135deg, #a78bfa, #67e8f9); font: inherit; font-weight: 900; transition: transform 180ms ease; }
      button:hover { transform: translateY(-2px); }
      @media (max-width: 42rem) { main { grid-template-columns: 1fr; } .brand { display: none; } }
    </style>
  </head>
  <body>
    <nav aria-label="Main navigation">
      <a class="brand" href="index.html">hello, world.</a>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </div>
    </nav>
    <main>
      <section>
        <span class="eyebrow">Say hello</span>
        <h1>Let’s make something wonderful.</h1>
        <p>Have an idea, a question, or just want to share what you’re building? Send a note below.</p>
      </section>
      <form action="#" onsubmit="event.preventDefault(); alert('Thanks for your message!');">
        <label>Name<input type="text" name="name" placeholder="Your name" required /></label>
        <label>Email<input type="email" name="email" placeholder="you@example.com" required /></label>
        <label>Message<textarea name="message" placeholder="Tell us what’s on your mind..." required></textarea></label>
        <button type="submit">Send message →</button>
      </form>
    </main>
  </body>
</html>
